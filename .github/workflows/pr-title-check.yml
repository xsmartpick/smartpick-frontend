name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title Format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR title: $PR_TITLE"

          # Conventional commit pattern with SMAR ticket number
          # Format: <type>(SMAR-<number>): <description>
          # Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)\(SMAR-[0-9]+\): .+$"

          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "❌ PR title does not follow conventional commit format!"
            echo ""
            echo "Expected format: <type>(SMAR-<number>): <description>"
            echo ""
            echo "Valid types:"
            echo "  - feat: A new feature"
            echo "  - fix: A bug fix"
            echo "  - docs: Documentation only changes"
            echo "  - style: Code style changes (formatting, semicolons, etc)"
            echo "  - refactor: Code refactoring (neither fixes a bug nor adds a feature)"
            echo "  - perf: Performance improvements"
            echo "  - test: Adding or updating tests"
            echo "  - build: Changes to build system or dependencies"
            echo "  - ci: Changes to CI configuration"
            echo "  - chore: Other changes (maintenance, tooling, etc)"
            echo ""
            echo "Examples:"
            echo "  ✅ feat(SMAR-11): Login BE (Basic Email Password Flow)"
            echo "  ✅ docs(SMAR-31): update api doc"
            echo "  ✅ chore(SMAR-24): add .gitignore"
            echo "  ✅ fix(SMAR-15): resolve authentication bug"
            echo ""
            echo "Your PR title: $PR_TITLE"
            exit 1
          fi

          echo "✅ PR title follows conventional commit format!"
